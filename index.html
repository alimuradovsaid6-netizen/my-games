<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Игровой Портал</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a2e; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin-bottom: 10px; color: #e94560; font-size: 2.2rem; }
        p { color: #8f94fb; margin-bottom: 20px; }
        .menu { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .menu button { background: #0f3460; border: 2px solid #e94560; color: #fff; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .menu button:hover, .menu button.active { background: #e94560; transform: translateY(-2px); }
        .game-container { position: relative; background: #16213e; border: 4px solid #0f3460; border-radius: 12px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; }
        canvas { background: #000; border-radius: 6px; box-shadow: inset 0 0 10px rgba(255,255,255,0.1); }
        .controls-hint { margin-top: 15px; font-size: 0.9rem; color: #a2a8d3; background: #0f3460; padding: 8px 16px; border-radius: 6px; }
        .game-section { display: none; flex-direction: column; align-items: center; }
        .game-section.active { display: flex; }
        .score { font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; color: #4ecca3; }
    </style>
</head>
<body>

    <h1>🎮 ШКОЛЬНЫЙ ИГРОВОЙ ЦЕНТР</h1>
    <p>Выбери игру и играй прямо в браузере!</p>

    <div class="menu">
        <button id="btn-snake" class="active" onclick="switchGame('snake')">🐍 Змейка</button>
        <button id="btn-tetris" onclick="switchGame('tetris')">🧩 Тетрис</button>
        <button id="btn-flappy" onclick="switchGame('flappy')">🐦 Flappy Bird</button>
    </div>

    <div class="game-container">
        <!-- ЗМЕЙКА -->
        <div id="game-snake" class="game-section active">
            <div class="score">Счет: <span id="snake-score">0</span></div>
            <canvas id="snakeCanvas" width="400" height="400"></canvas>
            <div class="controls-hint">Управление: Стрелки на клавиатуре</div>
        </div>

        <!-- ТЕТРИС -->
        <div id="game-tetris" class="game-section">
            <div class="score">Счет: <span id="tetris-score">0</span></div>
            <canvas id="tetrisCanvas" width="240" height="400"></canvas>
            <div class="controls-hint">Управление: ⬅️ ➡️ - Движение | ⬆️ - Поворот | ⬇️ - Ускорение</div>
        </div>

        <!-- FLAPPY BIRD -->
        <div id="game-flappy" class="game-section">
            <div class="score">Счет: <span id="flappy-score">0</span></div>
            <canvas id="flappyCanvas" width="360" height="480"></canvas>
            <div class="controls-hint">Управление: ПРОБЕЛ или Клик мышки - Прыжок</div>
        </div>
    </div>

    <script>
        let currentGame = 'snake';

        function switchGame(game) {
            currentGame = game;
            document.querySelectorAll('.game-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu button').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`game-${game}`).classList.add('active');
            document.getElementById(`btn-${game}`).classList.add('active');

            if(game === 'snake') initSnake();
            if(game === 'tetris') initTetris();
            if(game === 'flappy') initFlappy();
        }

        // ==================== ZMEIKA ====================
        let snakeInterval;
        function initSnake() {
            clearInterval(snakeInterval);
            const canvas = document.getElementById('snakeCanvas');
            const ctx = canvas.getContext('2d');
            const grid = 20;
            let count = 0;
            let score = 0;
            
            let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
            let apple = { x: 320, y: 320 };

            document.getElementById('snake-score').innerText = score;

            function loop() {
                snakeInterval = requestAnimationFrame(loop);
                if (++count < 6) return;
                count = 0;

                ctx.clearRect(0,0,canvas.width,canvas.height);

                snake.x += snake.dx;
                snake.y += snake.dy;

                if (snake.x < 0) snake.x = canvas.width - grid;
                else if (snake.x >= canvas.width) snake.x = 0;
                if (snake.y < 0) snake.y = canvas.height - grid;
                else if (snake.y >= canvas.height) snake.y = 0;

                snake.cells.unshift({x: snake.x, y: snake.y});
                if (snake.cells.length > snake.maxCells) snake.cells.pop();

                ctx.fillStyle = '#e94560';
                ctx.fillRect(apple.x, apple.y, grid-1, grid-1);

                ctx.fillStyle = '#4ecca3';
                snake.cells.forEach(function(cell, index) {
                    ctx.fillRect(cell.x, cell.y, grid-1, grid-1);
                    if (cell.x === apple.x && cell.y === apple.y) {
                        snake.maxCells++;
                        score += 10;
                        document.getElementById('snake-score').innerText = score;
                        apple.x = Math.floor(Math.random() * (canvas.width/grid)) * grid;
                        apple.y = Math.floor(Math.random() * (canvas.height/grid)) * grid;
                    }
                    for (let i = index + 1; i < snake.cells.length; i++) {
                        if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                            snake.x = 160; snake.y = 160; snake.cells = []; snake.maxCells = 4;
                            snake.dx = grid; snake.dy = 0; score = 0;
                            document.getElementById('snake-score').innerText = score;
                        }
                    }
                });
            }

            document.onkeydown = function(e) {
                if (currentGame !== 'snake') return;
                if (e.which === 37 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
                else if (e.which === 38 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
                else if (e.which === 39 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
                else if (e.which === 40 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
            };

            requestAnimationFrame(loop);
        }

        // ==================== TETRIS ====================
        let tetrisInterval;
        function initTetris() {
            cancelAnimationFrame(tetrisInterval);
            const canvas = document.getElementById('tetrisCanvas');
            const context = canvas.getContext('2d');
            context.scale(20, 20);

            let score = 0;
            document.getElementById('tetris-score').innerText = score;

            function arenaSweep() {
                let rowCount = 1;
                outer: for (let y = arena.length -1; y > 0; --y) {
                    for (let x = 0; x < arena[y].length; ++x) {
                        if (arena[y][x] === 0) continue outer;
                    }
                    const row = arena.splice(y, 1)[0].fill(0);
                    arena.unshift(row);
                    ++y;
                    score += rowCount * 10;
                    document.getElementById('tetris-score').innerText = score;
                }
            }

            function collide(arena, player) {
                const m = player.matrix;
                const o = player.pos;
                for (let y = 0; y < m.length; ++y) {
                    for (let x = 0; x < m[y].length; ++x) {
                        if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                    }
                }
                return false;
            }

            function createMatrix(w, h) {
                const matrix = [];
                while (h--) matrix.push(new Array(w).fill(0));
                return matrix;
            }

            function createPiece(type) {
                if (type === 'I') return [[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0]];
                else if (type === 'L') return [[0, 2, 0],[0, 2, 0],[0, 2, 2]];
                else if (type === 'J') return [[0, 3, 0],[0, 3, 0],[3, 3, 0]];
                else if (type === 'O') return [[4, 4],[4, 4]];
                else if (type === 'Z') return [[5, 5, 0],[0, 5, 5],[0, 0, 0]];
                else if (type === 'S') return [[0, 6, 6],[6, 6, 0],[0, 0, 0]];
                else if (type === 'T') return [[0, 7, 0],[7, 7, 7],[0, 0, 0]];
            }

            function drawMatrix(matrix, offset) {
                const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
                matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value !== 0) {
                            context.fillStyle = colors[value];
                            context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        }
                    });
                });
            }

            function draw() {
                context.fillStyle = '#000';
                context.fillRect(0, 0, canvas.width, canvas.height);
                drawMatrix(arena, {x: 0, y: 0});
                drawMatrix(player.matrix, player.pos);
            }

            function merge(arena, player) {
                player.matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                    });
                });
            }

            function rotate(matrix, dir) {
                for (let y = 0; y < matrix.length; ++y) {
                    for (let x = 0; x < y; ++x) {
                        [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                    }
                }
                if (dir > 0) matrix.forEach(row => row.reverse());
                else matrix.reverse();
            }

            function playerDrop() {
                player.pos.y++;
                if (collide(arena, player)) {
                    player.pos.y--;
                    merge(arena, player);
                    playerReset();
                    arenaSweep();
                }
                dropCounter = 0;
            }

            function playerMove(offset) {
                player.pos.x += offset;
                if (collide(arena, player)) player.pos.x -= offset;
            }

            function playerReset() {
                const pieces = 'TJLOSZI';
                player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
                player.pos.y = 0;
                player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
                if (collide(arena, player)) {
                    arena.forEach(row => row.fill(0));
                    score = 0;
                    document.getElementById('tetris-score').innerText = score;
                }
            }

            function playerRotate(dir) {
                const pos = player.pos.x;
                let offset = 1;
                rotate(player.matrix, dir);
                while (collide(arena, player)) {
                    player.pos.x += offset;
                    offset = -(offset + (offset > 0 ? 1 : -1));
                    if (offset > player.matrix[0].length) {
                        rotate(player.matrix, -dir);
                        player.pos.x = pos;
                        return;
                    }
                }
            }

            let dropCounter = 0;
            let dropInterval = 1000;
            let lastTime = 0;

            function update(time = 0) {
                if(currentGame !== 'tetris') return;
                const deltaTime = time - lastTime;
                lastTime = time;
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) playerDrop();
                draw();
                tetrisInterval = requestAnimationFrame(update);
            }

            const arena = createMatrix(12, 20);
            const player = { pos: {x: 0, y: 0}, matrix: null };

            document.onkeydown = event => {
                if(currentGame !== 'tetris') return;
                if (event.keyCode === 37) playerMove(-1);
                else if (event.keyCode === 39) playerMove(1);
                else if (event.keyCode === 40) playerDrop();
                else if (event.keyCode === 38) playerRotate(1);
            };

            playerReset();
            update();
        }

        // ==================== FLAPPY BIRD ====================
        let flappyInterval;
        function initFlappy() {
            cancelAnimationFrame(flappyInterval);
            const canvas = document.getElementById('flappyCanvas');
            const ctx = canvas.getContext('2d');

            let bird = { x: 50, y: 150, width: 20, height: 20, gravity: 0.6, lift: -10, velocity: 0 };
            let pipes = [];
            let frame = 0;
            let score = 0;
            document.getElementById('flappy-score').innerText = score;

            function jump() {
                if(currentGame === 'flappy') bird.velocity += bird.lift;
            }

            document.onkeydown = e => { if (e.code === 'Space') jump(); };
            canvas.onclick = jump;

            function loop() {
                if(currentGame !== 'flappy') return;
                ctx.fillStyle = '#70c5ce';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                bird.velocity += bird.gravity;
                bird.y += bird.velocity;

                if (bird.y + bird.height > canvas.height) { bird.y = canvas.height - bird.height; bird.velocity = 0; }
                if (bird.y < 0) { bird.y = 0; bird.velocity = 0; }

                ctx.fillStyle = '#ffeb3b';
                ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

                if (frame % 90 === 0) {
                    let top = Math.random() * (canvas.height / 2);
                    pipes.push({ x: canvas.width, top: top, bottom: canvas.height - top - 120, width: 40 });
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= 2;

                    ctx.fillStyle = '#2e7d32';
                    ctx.fillRect(pipes[i].x, 0, pipes[i].width, pipes[i].top);
                    ctx.fillRect(pipes[i].x, canvas.height - pipes[i].bottom, pipes[i].width, pipes[i].bottom);

                    if (bird.x < pipes[i].x + pipes[i].width && bird.x + bird.width > pipes[i].x &&
                       (bird.y < pipes[i].top || bird.y + bird.height > canvas.height - pipes[i].bottom)) {
                        pipes = []; frame = 0; score = 0; bird.y = 150; bird.velocity = 0;
                        document.getElementById('flappy-score').innerText = score;
                    }

                    if (pipes[i].x + pipes[i].width < bird.x && !pipes[i].passed) {
                        pipes[i].passed = true;
                        score++;
                        document.getElementById('flappy-score').innerText = score;
                    }

                    if (pipes[i].x + pipes[i].width < 0) pipes.splice(i, 1);
                }

                frame++;
                flappyInterval = requestAnimationFrame(loop);
            }
            loop();
        }

        initSnake();
    </script>
</body>
</html>
